

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find Flutter project
        id: project
        shell: bash
        run: |
          mapfile -t manifests < <(find . -type f -name pubspec.yaml -not -path '*/.dart_tool/*' -not -path '*/build/*')
          if [ "${#manifests[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one Flutter pubspec.yaml, found ${#manifests[@]}."
            exit 1
          fi
          project_dir="$(dirname "${manifests[0]}")"
          echo "dir=$project_dir" >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter pub get

      - name: Build APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoLab-Android-APK
          path: ${{ steps.project.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14
