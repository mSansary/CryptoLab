
name: Build CryptoLab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: cryptolab-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest CryptoLab version
        id: source
        shell: bash
        run: |
          shopt -s nullglob
          archives=(CryptoLab_Mobile_MVP_*.zip)

          if [ ${#archives[@]} -eq 0 ]; then
            echo "No CryptoLab version archive found!"
            exit 1
          fi

          latest=$(printf '%s\n' "${archives[@]}" | sort -V | tail -n 1)

          echo "Selected version: $latest"
          echo "archive=$latest" >> "$GITHUB_OUTPUT"

      - name: Extract selected version
        id: project
        shell: bash
        run: |
          SOURCE_DIR="$RUNNER_TEMP/cryptolab-source"
          mkdir -p "$SOURCE_DIR"

          unzip -q "${{ steps.source.outputs.archive }}" -d "$SOURCE_DIR"

          PUBSPEC=$(find "$SOURCE_DIR" -name pubspec.yaml -print -quit)

          if [ -z "$PUBSPEC" ]; then
            echo "pubspec.yaml not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PUBSPEC")
          echo "path=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter create --platforms=android .

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-cryptolab-v1
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter pub get

      - name: Fix Flutter compatibility
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          if grep -q 'CardTheme(' lib/main.dart; then
            sed -i 's/CardTheme(/CardThemeData(/g' lib/main.dart
          fi

      - name: Run tests
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter test

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.path }}
        shell: bash
        run: |
          for attempt in 1 2 3 4; do
            echo "Build attempt $attempt"

            if flutter build apk --release --no-pub; then
              exit 0
            fi

            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * 30))
            fi
          done

          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoLab-APK
          path: ${{ steps.project.outputs.path }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
