
name: Build CryptoLab APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: cryptolab-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project archives
        run: |
          find . -name "*.zip" -not -path "./.git/*" -print0 | while IFS= read -r -d '' archive; do
            unzip -o "$archive" -d .
          done

      - name: Find Flutter project
        id: project
        run: |
          mapfile -t files < <(find . -name pubspec.yaml -not -path "./.git/*")
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected exactly one pubspec.yaml, found ${#files[@]}"
            exit 1
          fi
          echo "path=$(dirname "${files[0]}")" >> "$GITHUB_OUTPUT"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter create --platforms=android .

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install dependencies
        working-directory: ${{ steps.project.outputs.path }}
        run: flutter pub get

      - name: Fix Flutter CardTheme compatibility
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          sed -i 's/CardTheme(/CardThemeData(/g' lib/main.dart

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          for attempt in 1 2 3 4; do
            echo "Build attempt $attempt"
            if flutter build apk --release --no-pub --verbose; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              sleep $((attempt * 30))
            fi
          done
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoLab-APK
          path: ${{ steps.project.outputs.path }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
